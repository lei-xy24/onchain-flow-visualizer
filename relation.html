<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>地址关联交易查询</title>
    <meta
      name="description"
      content="给定两个链上地址，查询示例资金流数据中的直接关联交易"
    />
    <link rel="stylesheet" href="./live.css?v=20260731-history-boundary" />
    <script src="./runtime-config.js?v=20260815-frontend-only"></script>
    <script type="module" src="./relation.js?v=20260731-history-boundary"></script>
  </head>
  <body class="analysis-body">
    <header class="site-header">
      <a class="site-brand" href="./index.html" aria-label="区块链与数字金融服务安全监控平台首页">
        <span>区块链与数字金融服务安全监控平台</span>
      </a>
      <nav class="tool-nav" aria-label="分析工具">
        <a href="./index.html">首页</a>
        <a href="./track.html">地址追踪</a>
        <a href="./live.html">实时交易</a>
        <a href="./profile.html">用户画像</a>
        <a href="./relation.html" aria-current="page">地址关联</a>
      </nav>
    </header>

    <main class="analysis-main">
      <section class="analysis-hero">
        <div>
          <p class="section-kicker">Address relation</p>
          <h1>地址关联交易查询</h1>
          <p>
            聚焦两个链上账户之间的资金往来，快速识别是否存在直接转账路径和对应交易记录。
          </p>
        </div>
        <form class="analysis-search relation-search" id="relation-form">
          <label for="relation-address-a">查询条件</label>
          <div class="analysis-search-row relation-search-row">
            <select id="relation-chain" aria-label="选择网络">
              <option value="eth">Ethereum</option>
              <option value="bsc">BNB Smart Chain</option>
              <option value="polygon">Polygon PoS</option>
            </select>
            <div class="analysis-history-field">
              <input
                id="relation-address-a"
                autocomplete="off"
                spellcheck="false"
                placeholder="地址 A"
              />
              <div
                class="search-history"
                id="relation-search-history-a"
                role="dialog"
                aria-label="地址 A 搜索历史"
                hidden
              >
                <div class="history-header">
                  <strong>搜索历史</strong>
                  <button class="history-clear" data-history-clear type="button">
                    全部清空
                  </button>
                </div>
                <ul class="history-list" data-history-list></ul>
                <p class="history-empty" data-history-empty hidden></p>
              </div>
            </div>
            <div class="analysis-history-field history-align-end">
              <input
                id="relation-address-b"
                autocomplete="off"
                spellcheck="false"
                placeholder="地址 B"
              />
              <div
                class="search-history"
                id="relation-search-history-b"
                role="dialog"
                aria-label="地址 B 搜索历史"
                hidden
              >
                <div class="history-header">
                  <strong>搜索历史</strong>
                  <button class="history-clear" data-history-clear type="button">
                    全部清空
                  </button>
                </div>
                <ul class="history-list" data-history-list></ul>
                <p class="history-empty" data-history-empty hidden></p>
              </div>
            </div>
            <button class="analysis-submit" type="submit">查询关联</button>
          </div>
          <p class="form-error" id="relation-error" hidden></p>
        </form>
      </section>

      <section class="relation-output" id="relation-output" aria-live="polite"></section>
    </main>
  </body>
</html>
