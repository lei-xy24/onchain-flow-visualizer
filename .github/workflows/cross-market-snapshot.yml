name: Global market snapshot

on:
  schedule:
    # 周二至周六 00:30 UTC（北京时间 08:30），覆盖前一交易日欧美收盘。
    - cron: "30 0 * * 2-6"
  workflow_dispatch:
    inputs:
      demo:
        description: "只校验演示结构（不请求 API、不发布）"
        type: boolean
        default: false

concurrency:
  group: global-market-snapshot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEMO_MODE: ${{ inputs.demo }}
      PUBLIC_DISPLAY_APPROVED: ${{ vars.EODHD_PUBLIC_DISPLAY_APPROVED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Validate demo calculation
        if: env.DEMO_MODE == 'true'
        run: node scripts/generate-cross-market-snapshot.mjs --demo --check-only
      - name: Explain market-data license gate
        if: env.DEMO_MODE != 'true' && env.PUBLIC_DISPLAY_APPROVED != 'true'
        run: echo "Live cross-market publishing is disabled until EODHD_PUBLIC_DISPLAY_APPROVED is true."
      - name: Generate global market snapshot
        if: env.DEMO_MODE != 'true' && env.PUBLIC_DISPLAY_APPROVED == 'true'
        env:
          EODHD_API_TOKEN: ${{ secrets.EODHD_API_TOKEN }}
          EODHD_BASE_URL: ${{ vars.EODHD_BASE_URL }}
          COINGECKO_DEMO_KEY: ${{ secrets.COINGECKO_API_KEY }}
          COINGECKO_BASE_URL: ${{ vars.COINGECKO_BASE_URL }}
        run: node scripts/generate-cross-market-snapshot.mjs
      - name: Publish global market snapshot
        if: env.DEMO_MODE != 'true' && env.PUBLIC_DISPLAY_APPROVED == 'true'
        run: node scripts/publish-cross-market-to-github.mjs
